name: SonarCloud Scan
on:
  push:
    branches:
      - test_githubaction
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout del codice
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9  # Cambia la versione se necessario

      # Step 3: Installa dipendenze Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./refair-server/requirements.txt

      # Step 4: Setup WebDriver (Chrome/Chromium)
      - name: Setup WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-chromedriver
          export PATH=$PATH:/usr/lib/chromium-browser/

      # DEBUG - SEE FILE AND DIRECTORY
      - name: List files and directories
        run: |
          echo "Current directory: $(pwd)"
          ls -R

      # Step 5: Avvia il server
      - name: Start the server
        run: |
          echo "Starting Flask server"
          echo "Current directory: $(pwd)"
          ls -l  # Controlla la struttura dei file
          export PYTHONPATH=$(pwd)
          export FLASK_APP=refair_server.app
          nohup python -m flask run --port=5001 --debug &  # Avvia Flask
          sleep 10  # Attendi che il server si avvii
          ps aux | grep flask  # Controlla se Flask è in esecuzione
          curl -I http://localhost:5001  # Verifica se il server risponde

      # Step 6: Attendi il server
      - name: Wait for server to start
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/healthcheck; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server..."
            sleep 5
          done

      # Step 7: Esegui test con pytest
      - name: Run Pytest
        env:
          DISPLAY: :99  # Necessario per test headless
        run: pytest --headless

      # Step 8: Setup Java per SonarCloud
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: 'temurin'

      # Step 9: Cache SonarCloud
      - name: Cache SonarCloud
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Step 10: Run SonarCloud Scan
      - name: Run SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
          -Dsonar.projectKey=pastore99_ReFair-App \
          -Dsonar.organization=pastore99 \
          -Dsonar.host.url=https://sonarcloud.io

  sonarcloudScan1:
    name: SonarCloudScan1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Kaggle
        run: pip install kaggle
        working-directory: ./refair-server

      - name: Download glove.6B.100d.txt from Kaggle
        run: kaggle datasets download -d danielwillgeorge/glove6b100dtxt -p ./downloads
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        working-directory: ./refair-server

      - name: Unzip downloaded file
        run: unzip ./downloads/glove6b100dtxt.zip -d ./models
        working-directory: ./refair-server

      - name: Install tox
        run: pip install tox
        working-directory: ./refair-server

      - name: Run tox
        run: tox -e py
        working-directory: ./refair-server

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_SERVER }}
        with:
          projectBaseDir: refair-server/
  sonarcloudScan2:
    name: SonarCloudScan2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./refair-client

      - name: Test and coverage
        run: npm run coverage
        working-directory: ./refair-client

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_CLIENT }}
        with:
          projectBaseDir: refair-client/
