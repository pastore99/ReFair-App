name: Full Pipeline (Server + Client + Sonar)

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test_and_scan:
    runs-on: ubuntu-latest
    steps:
      # 1) CHECKOUT CODICE
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) SETUP PYTHON & DEPENDENZE
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/envs/requirements.txt

      # 3) AVVIO DEI MICROSERVIZI E API GATEWAY
      - name: Start microservices and API Gateway
        run: |
          chmod +x server/envs/domain_prediction_env/bin/activate
          chmod +x server/envs/tasks_prediction_env/bin/activate
          chmod +x server/envs/file_management_env/bin/activate
          chmod +x server/envs/report_generation_env/bin/activate
          chmod +x server/envs/feedback_env/bin/activate
          chmod +x server/envs/api_gateway_env/bin/activate
          
          nohup bash -c "source server/envs/domain_prediction_env/bin/activate && python server/microservices/domain_prediction_service.py" &
          sleep 2
          nohup bash -c "source server/envs/tasks_prediction_env/bin/activate && python server/microservices/task_prediction_service.py" &
          sleep 2
          nohup bash -c "source server/envs/file_management_env/bin/activate && python server/microservices/file_management_service.py" &
          sleep 2
          nohup bash -c "source server/envs/report_generation_env/bin/activate && python server/microservices/report_generation_service.py" &
          sleep 2
          nohup bash -c "source server/envs/feedback_env/bin/activate && python server/microservices/feedback_service.py" &
          sleep 2
          nohup bash -c "source server/envs/api_gateway_env/bin/activate && python server/api_gateway/api_gateway.py" &
          sleep 2

      # 4) SETUP NODE + AVVIO CLIENT
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Client)
        run: npm install
        working-directory: ./client/web_app

      - name: Start client application
        run: |
          nohup npm run dev --prefix ./client/web_app &
          sleep 5

      - name: Check if client is running
        run: curl -I http://localhost:5173 || exit 1

      # 5) TEST E SCANSIONE SONARCLOUD
      - name: Run Pytest
        env:
          DISPLAY: :99
        run: |
          cd refair-server
          pytest --maxfail=1 --disable-warnings -q

      - name: Client test and coverage
        run: npm run coverage
        working-directory: ./client/web_app

      - name: Setup Java (for SonarCloud)
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: temurin

