name: SonarCloud Unit Tests

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  setup_and_run_tests:
    name: Setup and Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install global dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle psutil requests

      # **Microservices Environment**
      - name: Create and setup virtual environment for microservices
        run: |
          python -m venv server/envs/microservices_env
          source server/envs/microservices_env/bin/activate
          pip install -r server/envs/requirements.txt
          pip install psutil
          deactivate

      - name: Start all microservices
        run: |
          source server/envs/microservices_env/bin/activate
          for service in server/microservices/*; do
            if [ -d "$service" ]; then
              service_script="$service/$(basename $service).py"
              if [ -f "$service_script" ]; then
                echo "Starting $service_script..."
                nohup python "$service_script" > "$service.log" 2>&1 &
                sleep 5
                echo "$service_script started"
              else
                echo "Skipping $service (no matching .py file)"
              fi
            fi
          done
          deactivate

      # **API Gateway Environment**
      - name: Create and setup virtual environment for API Gateway
        run: |
          python -m venv server/envs/apigateway_env
          source server/envs/apigateway_env/bin/activate
          pip install -r server/envs/requirements_apigateway.txt
          deactivate

      - name: Start API Gateway
        run: |
          source server/envs/apigateway_env/bin/activate
          nohup python server/api_gateway/api_gateway.py > apigateway.log 2>&1 &
          sleep 2
          deactivate

      # **Scarica GloVe embeddings**
      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Download glove.6B.100d.txt from Kaggle
        run: kaggle datasets download -d danielwillgeorge/glove6b100dtxt -p ./downloads
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        working-directory: ./server

      - name: Unzip downloaded file
        run: unzip ./downloads/glove6b100dtxt.zip -d ./utils/models
        working-directory: ./server

      # **Unit Test Environment**
      - name: Create and setup virtual environment for unit tests
        run: |
          python -m venv server/envs/test_env
          source server/envs/test_env/bin/activate
          pip install -r server/requirements.txt
          pip install psutil
          deactivate

      # Start Monitor dei Microservizi**
      - name: Start microservice monitor
        run: |
          source server/envs/microservices_env/bin/activate
          nohup python server/scripts/monitor_microservices.py > monitor.log 2>&1 &
          deactivate
          cat monitor.log

      # Esegui Test**
      - name: Run Unit Tests
        run: |
          source server/envs/test_env/bin/activate
          pytest test/unit test/integration --maxfail=10 --disable-warnings -q
          deactivate

