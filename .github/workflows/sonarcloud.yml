name: SonarCloud Unit Tests

on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  setup_and_run_tests:
    name: Setup and Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install global dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle psutil requests

      # **Microservices Environment**
      - name: Create and setup virtual environment for microservices
        run: |
          python -m venv server/envs/microservices_env
          source server/envs/microservices_env/bin/activate
          pip install -r server/envs/requirements.txt
          pip install psutil
          deactivate

      - name: Start all microservices
        run: |
          source server/envs/microservices_env/bin/activate
          for service_script in server/microservices/*.py; do
            if [ -f "$service_script" ]; then
              echo "Starting $service_script..."
              nohup python "$service_script" > "${service_script%.py}.log" 2>&1 &
              sleep 5
              echo "$service_script started"
            fi
          done
          deactivate

      # **API Gateway Environment**
      - name: Create and setup virtual environment for API Gateway
        run: |
          python -m venv server/envs/apigateway_env
          source server/envs/apigateway_env/bin/activate
          pip install -r server/envs/requirements_apigateway.txt
          deactivate

      - name: Start API Gateway
        run: |
          source server/envs/apigateway_env/bin/activate
          nohup python server/api_gateway/api_gateway.py > apigateway.log 2>&1 &
          sleep 2
          deactivate

      # **Scarica GloVe embeddings**
      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Download glove.6B.100d.txt from Kaggle
        run: kaggle datasets download -d danielwillgeorge/glove6b100dtxt -p ./downloads
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        working-directory: ./server

      - name: Unzip and move GloVe file to correct location
        run: |
          mkdir -p ./server/utils/models  # Assicuriamoci che la cartella esista
          unzip -o ./downloads/glove6b100dtxt.zip -d ./server/utils/models/
          ls -l ./server/utils/models/  # Debug: Mostra il contenuto della cartella
        working-directory: ./server

      # **Unit Test Environment**
      - name: Create and setup virtual environment for unit tests
        run: |
          python -m venv server/envs/test_env
          source server/envs/test_env/bin/activate
          pip install -r server/requirements.txt
          pip install psutil
          deactivate

      - name: Check Microservices Status
        run: |
          echo "Verifying if microservices are running..."
          sleep 5
          for service_script in server/microservices/*.py; do
            service_name=$(basename "$service_script" .py)

            if [ "$service_name" == "__init__" ]; then
              continue
            fi

            if ! pgrep -f "$service_script" > /dev/null; then
              echo "Microservice $service_name is not running!"
              if [ -f "${service_script%.py}.log" ]; then
                cat "${service_script%.py}.log"
              else
                echo "No log file found for $service_name"
              fi
            else
              echo "Microservice $service_name is running."
            fi
          done

      # Esegui Test**
      - name: Run Unit Tests
        run: |
          source server/envs/test_env/bin/activate
          pytest test/unit test/integration --ignore=test/unit/test_feedback_service.py --ignore=test/unit/test_task_prediction_service.py --maxfail=10 --disable-warnings -q
          deactivate


