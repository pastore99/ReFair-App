name: SonarCloud Unit Tests
on:
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  setup_and_run_tests:
    name: Setup and Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      # 1. Creazione ambiente virtuale per i microservizi
      - name: Create and setup virtual environment for microservices
        run: |
          python -m venv server/envs/microservices_env
          source server/envs/microservices_env/bin/activate
          pip install -r server/envs/requirements.txt
          deactivate

      - name: Start all microservices
        run: |
          source server/envs/microservices_env/bin/activate
          for service in server/microservices/*; do
            if [ -d "$service" ]; then
              nohup python "$service/$(basename $service).py" &
              sleep 2
            fi
          done
          deactivate

      # 2. Creazione ambiente virtuale per API Gateway
      - name: Create and setup virtual environment for API Gateway
        run: |
          python -m venv server/envs/apigateway_env
          source server/envs/apigateway_env/bin/activate
          pip install -r server/envs/requirements_apigateway.txt
          deactivate

      - name: Start API Gateway
        run: |
          source server/envs/apigateway_env/bin/activate
          nohup python server/api_gateway/api_gateway.py &
          sleep 2
          deactivate

      # 3. Creazione ambiente virtuale per test di unità
      - name: Create and setup virtual environment for unit tests
        run: |
          python -m venv server/envs/test_env
          source server/envs/test_env/bin/activate
          pip install -r server/requirements.txt
          deactivate

      - name: Run Unit Tests
        run: |
          source server/envs/test_env/bin/activate
          pytest test --maxfail=1 --disable-warnings -q
          deactivate

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_SERVER }}
        with:
          projectBaseDir: server/
